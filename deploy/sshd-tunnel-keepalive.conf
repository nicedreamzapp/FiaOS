# Put this on the VPS as /etc/ssh/sshd_config.d/10-tunnel-keepalive.conf
# then: sshd -t && systemctl reload ssh
#
# Without it ClientAliveInterval defaults to 0 and sshd NEVER notices a tunnel
# client that vanished -- a laptop that slept, a machine that changed networks.
# The dead session keeps holding its forwarded port, and two things break at
# once:
#   1. nginx still connects to that port, then hangs on read forever
#   2. the machine trying to reconnect gets "remote port forwarding failed",
#      because the corpse still owns the port, and loops on that indefinitely
# That combination took one machine's tab offline for over eight hours.
#
# 30s x 3 = a dead client is dropped in about 90 seconds and its ports come free.
ClientAliveInterval 30
ClientAliveCountMax 3
TCPKeepAlive yes
