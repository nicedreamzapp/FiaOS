# FiaOS reverse proxy — one hostname, several machines.
# Each machine runs its own copy of FiaOS on its own local port 9000 and
# reverse-tunnels it here on a port of its own (see deploy/tunnel_to_vps.sh).
# The fia_target cookie, set by the machine tabs in the UI, picks which one
# you land on. Replace fia.example.com with your hostname.

# Cache zone for FIA static assets
proxy_cache_path /var/cache/nginx/fia levels=1:2 keys_zone=fia_cache:10m max_size=100m inactive=60m;

# Which Mac (or PC) fia.example.com points at right now.
# Set by the MINI/M5/PC tabs in the FiaOS UI, which write the fia_target cookie.
# Each machine runs its own copy of FiaOS on its own local port 9000 and
# reverse-tunnels it here on a port of its own.
map $cookie_fia_target $fia_upstream {
    default   fia_mini;          # mac mini  (tunnel -R 9000)
    mini      fia_mini;
    m5        fia_m5;            # M5 MacBook Pro (tunnel -R 9010)
    pc        fia_pc;            # work PC        (tunnel -R 9020)
}

# While the PC side of FiaOS is being built, a dead PC must 502 honestly --
# falling back to the mini would make a half-finished PC look like it works.
# The mini and M5 keep the fallback. Flip pc back to 1 once the PC is live.
map $cookie_fia_target $fia_fallback_ok {
    default   1;
    pc        0;
}

upstream fia_mini { server 127.0.0.1:9000; keepalive 16; keepalive_timeout 300s; }
upstream fia_m5   { server 127.0.0.1:9010; keepalive 16; keepalive_timeout 300s; }
upstream fia_pc   { server 127.0.0.1:9020; keepalive 16; keepalive_timeout 300s; }

server {
    location /.well-known/acme-challenge/ { root /var/www/html; }
    server_name fia.example.com;

    # Allow large uploads (photos/scans) through to FiaOS; aiohttp accepts 100MB.
    client_max_body_size 100M;


    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 256;
    gzip_comp_level 6;

    # --- Machine tabs ----------------------------------------------------
    # The MINI / M5 / PC tabs live in the FiaOS UI itself, not on a page of
    # their own. All the VPS provides is a liveness probe per machine so the
    # tabs can show a green or red dot.
    # 200 = that machine's tunnel is up, 502 = it is not.
    # Cheap: hits FiaOS's own login page.
    location = /machines/probe/mini {
        proxy_pass http://127.0.0.1:9000/login;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        proxy_cache off;
        add_header Cache-Control "no-store" always;
    }
    location = /machines/probe/m5 {
        proxy_pass http://127.0.0.1:9010/login;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        proxy_cache off;
        add_header Cache-Control "no-store" always;
    }
    location = /machines/probe/pc {
        proxy_pass http://127.0.0.1:9020/login;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
        proxy_cache off;
        add_header Cache-Control "no-store" always;
    }

    # Terminal WebSocket - no caching, direct tunnel

    location /api/screen {
        proxy_pass http://$fia_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    location /api/terminal {
        proxy_pass http://$fia_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    # Static assets - cache aggressively on VPS
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|map)$ {
        proxy_pass http://$fia_upstream;
        proxy_intercept_errors on;
        error_page 502 504 = @fia_fallback;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Cache on VPS. Key includes the chosen machine so the mini's assets
        # can never be served for the M5 (they run separate copies of FiaOS).
        proxy_cache fia_cache;
        proxy_cache_key "$fia_upstream$request_uri";
        proxy_cache_valid 200 60m;
        proxy_cache_valid 404 1m;
        proxy_cache_use_stale error timeout updating;
        add_header X-Cache-Status $upstream_cache_status;

        # Browser cache
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }

    # Login page - cache briefly
    location /login {
        proxy_pass http://$fia_upstream;
        proxy_intercept_errors on;
        error_page 502 504 = @fia_fallback;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Never cache the app's own pages. Caching them means two devices can
        # sit on different versions of FiaOS for minutes after a change, which
        # looks exactly like the page "rendering wrong" on one machine.
        proxy_cache off;
        add_header Cache-Control "no-store" always;
    }

    # /api/command — long-running commands (image/video gen, ComfyUI, etc.)
    # Must NOT time out. Streaming + 30 min ceiling. No buffering so output
    # flushes back through nginx + Cloudflare as it arrives, keeping the
    # connection alive against idle timers.
    location /api/command {
        proxy_pass http://$fia_upstream;
        proxy_intercept_errors on;
        error_page 502 504 = @fia_fallback;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_request_buffering off;
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no;
    }

    # /api/ — all other API calls. Generous timeout so synthesize/chat/etc.
    # can take their time too, but keep buffering on for clean JSON responses.
    location /api/ {
        proxy_pass http://$fia_upstream;
        proxy_intercept_errors on;
        error_page 502 504 = @fia_fallback;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 8 16k;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # --- Dead-machine fallback -------------------------------------------
    # The fia_target cookie is sticky. If Matt last clicked the PC (or M5)
    # tab and that machine is now off, every page load 502s until he clears
    # the cookie by hand. Instead: when the chosen machine's tunnel is dead,
    # serve the mini (which is always on) and rewrite the cookie so the rest
    # of the session follows. The machine tabs keep their own probes, so the
    # UI still shows the truth about which boxes are up.
    location @fia_fallback {
        if ($fia_fallback_ok = 0) {
            return 502 "FiaOS: the PC is not serving yet. SSH tunnel is up on :9020 but nothing is listening behind it on the PC.\n";
        }
        proxy_pass http://fia_mini;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache off;
        add_header Set-Cookie "fia_target=mini; Path=/; Max-Age=31536000; SameSite=Lax" always;
        add_header X-Fia-Fallback "mini" always;
    }

    # Everything else
    location / {
        proxy_pass http://$fia_upstream;
        proxy_intercept_errors on;
        error_page 502 504 = @fia_fallback;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering on;
        proxy_buffer_size 8k;
        proxy_buffers 8 8k;
    }

    listen [::]:443 ssl;
    listen 443 ssl;
    # certs: run `certbot --nginx -d fia.example.com`

}

server {
    listen 80;
    listen [::]:80;
    server_name fia.example.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}
