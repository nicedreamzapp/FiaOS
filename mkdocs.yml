site_name: FiaOS
site_description: >-
  FiaOS is a self-hosted Python web server that puts a computer's live screen
  and a real PTY terminal (Claude Code, vim, top) in any browser, for macOS
  and Windows, behind one password.
site_author: Matt Macosko
# TODO-VERIFY: placeholder until GitHub Pages is enabled for this repo.
site_url: https://nicedreamzapp.github.io/FiaOS/
repo_url: https://github.com/nicedreamzapp/FiaOS
repo_name: nicedreamzapp/FiaOS
edit_uri: edit/main/docs/
copyright: FiaOS is MIT licensed. Built by Matt Macosko.

theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight
    - toc.follow

plugins:
  - search
  - social
  # The sitemap is generated by MkDocs itself (sitemap.xml) whenever site_url is set.

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Install: install.md
  - Quickstart: quickstart.md
  - Configuration: configuration.md
  - How it works: how-it-works.md
  - Troubleshooting: troubleshooting.md
  - FAQ: faq.md
  - Changelog: changelog.md
  - Credits: credits.md

not_in_nav: |
  /screenshots/*
