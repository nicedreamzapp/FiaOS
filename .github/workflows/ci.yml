name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-test.txt

      - name: Install zsh (to syntax-check the zsh scripts)
        run: sudo apt-get install -y --no-install-recommends zsh

      - name: Install test dependencies
        run: pip install -r requirements-test.txt

      - name: flake8 (syntax errors and undefined names)
        run: flake8 --select=E9,F63,F7,F82 --show-source --statistics .

      - name: pytest
        run: python -m pytest -v --durations=10
