<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FiaOS — Login</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro', sans-serif;
    background: #0a0a0f;
    color: #e0e0e0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}
.login-box {
    background: #16161e;
    border: 1px solid #2a2a3a;
    border-radius: 16px;
    padding: 48px 40px;
    width: 360px;
    text-align: center;
}
h1 {
    font-size: 28px;
    font-weight: 600;
    margin-bottom: 8px;
    background: linear-gradient(135deg, #6366f1, #a78bfa);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}
.subtitle { color: #666; font-size: 14px; margin-bottom: 32px; }
input {
    width: 100%;
    padding: 14px 16px;
    background: #0e0e14;
    border: 1px solid #2a2a3a;
    border-radius: 10px;
    color: #e0e0e0;
    font-size: 16px;
    outline: none;
    margin-bottom: 16px;
}
input:focus { border-color: #6366f1; }
button {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, #6366f1, #7c3aed);
    border: none;
    border-radius: 10px;
    color: white;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s;
}
button:hover { opacity: 0.9; }
.pw-wrap { position: relative; }
.pw-wrap input { padding-right: 48px; }
.pw-eye { position: absolute; right: 6px; top: 6px; width: 38px; height: 38px; padding: 0;
    background: none; display: flex; align-items: center; justify-content: center; color: #666; }
.pw-eye:hover { color: #e0e0e0; opacity: 1; }
.pw-eye .slash { display: none; }
.pw-eye.on .slash { display: inline; }
.error { color: #ef4444; font-size: 13px; margin-top: 12px; display: none; }

/* Machine tabs — pick which Mac to sign in to before typing the password. */
.machines { display:flex; justify-content:center; gap:0; margin:16px 0 22px;
  border-bottom:1px solid #1e1e2e; }
.mbtn {
  background:none; border:0; font-family:inherit; cursor:pointer;
  padding:8px 16px; font-size:12px; font-weight:600; letter-spacing:.6px;
  text-transform:uppercase; color:#666;
  display:flex; align-items:center; gap:6px;
  border-bottom:2px solid transparent; margin-bottom:-1px;
  transition:color .15s, border-color .15s;
}
.mbtn:hover { color:#e0e0e0; }
.mbtn.here { color:#6366f1; border-bottom-color:#6366f1; }
.mbtn .md { width:6px; height:6px; border-radius:50%; background:#666; flex:none; }
.mbtn .md.up { background:#22c55e; }
.mbtn .md.down { background:#ef4444; }
.mbtn[data-live="down"] { opacity:.45; }
</style>
</head>
<body>
<div class="login-box">
    <h1>FiaOS</h1>
    <p class="subtitle">Remote Mac Control Center</p>
    <div class="machines" id="machines"></div>
    <form id="loginForm">
        <div class="pw-wrap">
            <input type="password" id="password" placeholder="Password" autocomplete="current-password" autofocus>
            <button type="button" class="pw-eye" id="pwEye" aria-label="Show password" title="Show password">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/><line class="slash" x1="3" y1="3" x2="21" y2="21"/></svg>
            </button>
        </div>
        <button type="submit">Sign In</button>
    </form>
    <p class="error" id="error"></p>
</div>
<script>
document.getElementById('pwEye').addEventListener('click', () => {
    const pw = document.getElementById('password'), eye = document.getElementById('pwEye');
    const show = pw.type === 'password';
    pw.type = show ? 'text' : 'password';
    eye.classList.toggle('on', show);
    eye.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
    eye.title = eye.getAttribute('aria-label');
    pw.focus();
});
document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const pw = document.getElementById('password').value;
    const errEl = document.getElementById('error');
    errEl.style.display = 'none';
    try {
        const res = await fetch('/api/login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({password: pw})
        });
        if (res.ok) {
            const data = await res.json();
            if (data.token) localStorage.setItem('fiaos_token', data.token);
            window.location.href = '/';
        } else {
            const data = await res.json();
            errEl.textContent = data.error || 'Login failed';
            errEl.style.display = 'block';
        }
    } catch (err) {
        errEl.textContent = 'Connection error';
        errEl.style.display = 'block';
    }
});
</script>
<script>
(function(){
  const MACHINES=[{key:'mini',label:'Mini'},{key:'m5',label:'M5'},{key:'pc',label:'PC'}];
  const m=document.cookie.match(/(?:^|;\s*)fia_target=([^;]+)/);
  const here=m?decodeURIComponent(m[1]):'mini';
  const box=document.getElementById('machines'); if(!box) return;
  for(const mc of MACHINES){
    const b=document.createElement('button');
    b.className='mbtn'+(mc.key===here?' here':''); b.type='button';
    b.title=mc.key===here?'signing in to this machine':'sign in to '+mc.label;
    b.innerHTML='<span class="md" id="md-'+mc.key+'"></span>'+mc.label;
    b.onclick=()=>{ if(mc.key===here) return;
      document.cookie='fia_target='+mc.key+'; path=/; max-age=31536000; samesite=lax';
      location.reload(); };
    box.appendChild(b);
    fetch('/machines/probe/'+mc.key,{cache:'no-store'})
      .then(r=>mark(mc.key,r.status>=200&&r.status<400)).catch(()=>mark(mc.key,false));
  }
  function mark(k,up){ const d=document.getElementById('md-'+k); if(!d) return;
    d.className='md '+(up?'up':'down'); if(!up) d.closest('.mbtn').dataset.live='down'; }
})();
</script>
</body>
</html>
