<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FiaOS</title>
<link rel="stylesheet" href="/static/vendor/xterm.min.css">
<script src="/static/vendor/xterm.min.js"></script>
<script src="/static/vendor/xterm-addon-fit.min.js"></script>
<style>
:root {
    --bg: #0a0a0f; --panel: #12121a; --border: #1e1e2e; --text: #e0e0e0;
    --dim: #666; --accent: #6366f1; --accent2: #7c3aed; --green: #22c55e;
    --red: #ef4444; --yellow: #eab308; --blue: #3b82f6;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro', sans-serif;
    background: var(--bg); color: var(--text); height: 100vh; overflow: hidden;
}
.topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 16px; background: var(--panel); border-bottom: 1px solid var(--border);
    height: 44px; flex-shrink: 0;
}
.topbar h1 {
    font-size: 16px; font-weight: 700;
    background: linear-gradient(135deg, #6366f1, #a78bfa);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
}
/* Machine tabs — the same page drives the mini, the M5 or the work PC.
   Clicking one sets the fia_target cookie; nginx routes every request
   (screen, terminal, files, API) to that machine's tunnel. */
.machines { display: flex; align-items: stretch; height: 100%; margin-left: 18px; }
.mbtn {
    background: none; border: 0; font-family: inherit; cursor: pointer;
    padding: 0 15px; font-size: 12px; font-weight: 600; letter-spacing: .6px;
    text-transform: uppercase; color: var(--dim);
    display: flex; align-items: center; gap: 6px;
    border-bottom: 2px solid transparent; margin-bottom: -9px;
    transition: color .15s, border-color .15s;
}
.mbtn:hover { color: var(--text); }
.mbtn.here { color: var(--accent); border-bottom-color: var(--accent); }
.mbtn .md { width: 6px; height: 6px; border-radius: 50%; background: var(--dim); flex: none; }
.mbtn .md.up { background: var(--green); }
.mbtn .md.down { background: var(--red); }
.mbtn[data-live="down"] { opacity: .45; }
.iconbtn {
    background: none; border: 0; color: var(--dim); cursor: pointer;
    font-size: 15px; line-height: 1; padding: 4px 6px; font-family: inherit;
}
.iconbtn:hover { color: var(--text); }
/* Full screen — hide every bit of chrome, the remote desktop takes the glass. */
body.fullscreen .topbar, body.fullscreen .tabs { display: none; }
.chips { display: flex; gap: 8px; align-items: center; }
.chip {
    font-size: 10px; padding: 3px 8px; border-radius: 20px;
    background: #1a1a2e; border: 1px solid var(--border);
}
.chip.on { border-color: var(--green); color: var(--green); }
.topbar a { color: var(--dim); text-decoration: none; font-size: 12px; }
.tabs {
    display: flex; background: var(--panel); border-bottom: 1px solid var(--border);
    overflow-x: auto; flex-shrink: 0;
}
.tab {
    padding: 10px 22px; font-size: 13px; color: var(--dim); cursor: pointer;
    border-bottom: 2px solid transparent; white-space: nowrap; transition: all 0.2s;
    font-weight: 500;
}
.tab:hover { color: var(--text); }
.tab.active { color: var(--accent); border-bottom-color: var(--accent); }
.panel { display: none; flex-direction: column; flex: 1; overflow: hidden; }
.panel.active { display: flex; }

/* SCREEN */
.screen-wrap { flex: 1; display: flex; overflow: hidden; background: #000; outline: none; position: relative; }
#screenCanvas { width: 100%; height: 100%; object-fit: contain; cursor: crosshair; -webkit-user-select: none; user-select: none; touch-action: none; }
/* Real, focusable and off-screen — a phone raises its keyboard only for an
   actual focused text field, which is why focusing the wrapper div never
   worked. Never display:none or visibility:hidden: iOS refuses to focus a
   field it considers invisible. 16px font or iOS zooms the page on focus. */
#keyInput { position: absolute; left: 2px; bottom: 2px; width: 1px; height: 1px; opacity: .01; border: 0; padding: 0; background: transparent; color: transparent; font-size: 16px; }
.touch-bar { position: absolute; left: 8px; right: 8px; bottom: 8px; display: none; gap: 6px; justify-content: center; flex-wrap: wrap; }
.touch-bar button { background: rgba(20,20,24,.82); color: #eee; border: 1px solid var(--border); border-radius: 8px; padding: 9px 13px; font-size: 14px; line-height: 1; -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
.touch-bar button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
body.touch .touch-bar { display: flex; }
.screen-msg { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); padding: 14px 18px; background: rgba(0,0,0,.75); border: 1px solid var(--border); border-radius: 10px; font-size: 13px; color: var(--dim); }

/* TERMINAL */
.term-status { padding: 4px 12px; font-size: 11px; color: var(--dim); border-bottom: 1px solid var(--border); display: flex; gap: 12px; align-items: center; flex-shrink: 0; }
.term-status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--red); display: inline-block; }
.term-status.connected .dot { background: var(--green); }
.btn { background: var(--accent); border: none; border-radius: 8px; color: white; padding: 8px 14px; font-size: 13px; cursor: pointer; white-space: nowrap; }
.btn:hover { opacity: 0.85; }
.btn.green { background: var(--green); }
.btn.ghost { background: transparent; border: 1px solid var(--border); color: var(--dim); }
.term-quick { display: flex; gap: 6px; padding: 6px 12px; border-bottom: 1px solid var(--border); flex-shrink: 0; flex-wrap: wrap; }
.term-quick button { background: #1a1a2e; border: 1px solid var(--border); border-radius: 6px; color: var(--dim); font-size: 11px; padding: 4px 10px; cursor: pointer; font-family: 'SF Mono',monospace; }
.term-quick button:hover { color: var(--text); border-color: var(--accent); }
#xterm-container { flex: 1; padding: 6px 8px; background: #000; overflow: hidden; }
#xterm-container .xterm { height: 100%; }
#xterm-container .xterm-viewport { background-color: transparent !important; }

::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #2a2a3a; border-radius: 3px; }
.main { display: flex; flex-direction: column; height: calc(100vh - 44px); }
</style>
</head>
<body>
<div class="topbar">
    <h1>FiaOS</h1>
    <div class="machines" id="machines"></div>
    <div class="chips">
        <span class="chip on" id="statusChip">Online</span>
        <span class="chip" id="cpuChip">CPU --</span>
        <span class="chip" id="ramChip">RAM --</span>
    </div>
    <button class="iconbtn" id="fsBtn" type="button" title="Full screen">&#x2921;</button>
    <a href="/logout">Sign Out</a>
</div>
<div class="main">
    <div class="tabs">
        <div class="tab active" data-tab="screen">Screen</div>
        <div class="tab" data-tab="terminal">Terminal</div>
    </div>

    <!-- SCREEN — live desktop, only changed tiles come over the wire -->
    <div class="panel active" id="tab-screen">
        <div class="screen-wrap" id="screenWrap" tabindex="0">
            <canvas id="screenCanvas"></canvas>
            <div class="screen-msg" id="screenMsg">Connecting&hellip;</div>
            <input id="keyInput" type="text" inputmode="text" autocapitalize="off"
                   autocorrect="off" autocomplete="off" spellcheck="false"
                   aria-label="Send keystrokes to the Mac">
            <div class="touch-bar" id="touchBar">
                <button id="kbBtn" title="Keyboard">&#9000;</button>
                <button data-mod="cmd">&#8984;</button>
                <button data-key="Tab">tab</button>
                <button data-key="Escape">esc</button>
                <button data-key="Enter">&#8629;</button>
                <button data-key="ArrowUp">&#8593;</button>
                <button data-key="ArrowDown">&#8595;</button>
            </div>
        </div>
    </div>

    <!-- TERMINAL -->
    <div class="panel" id="tab-terminal">
        <div class="term-status" id="termStatus"><span class="dot"></span><span id="termStatusText">Connecting...</span><span style="margin-left:auto;color:var(--dim)">interactive zsh on Mac mini</span></div>
        <div class="term-quick">
            <button data-cmd="claude">claude</button>
            <button data-cmd="cd ~/Desktop && ls">~/Desktop</button>
            <button data-cmd="cd ~/Desktop/PROJECTS && ls">~/PROJECTS</button>
            <button data-cmd="top -l 1 | head -20">top</button>
            <button data-cmd="tail -20 /tmp/fiaos.log">fiaos log</button>
            <button data-cmd="clear">clear</button>
        </div>
        <div id="xterm-container"></div>
    </div>

</div>

<script>
let termWs = null;
let authOk = true;

// ===== AUTH — intercept 401 and redirect =====
const _fetch = window.fetch;
window.fetch = async function(...args) {
    const res = await _fetch.apply(this, args);
    if (res.status === 401 && authOk) { authOk = false; window.location.href = '/login'; }
    return res;
};
function getToken() {
    const m = document.cookie.match(/(^| )fiaos_session=([^;]+)/);
    if (m) return m[2];
    return localStorage.getItem('fiaos_token') || '';
}

// ===== TABS =====
document.querySelectorAll('.tab').forEach(tab => {
    tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById('tab-' + tab.dataset.tab).classList.add('active');
        if (tab.dataset.tab === 'screen') screenConnect(); else screenDisconnect();
        if (tab.dataset.tab === 'terminal' && term && fitAddon) {
            setTimeout(() => { try { fitAddon.fit(); } catch {} term.focus(); }, 50);
        }
    });
});

// ===== SCREEN =====
// The desktop arrives as changed tiles on one socket and is patched into a
// canvas, so a still screen costs nothing and a scrolling window only costs the
// part that moved. The same socket carries clicks, drags and typing back.
const screenWrap = document.getElementById('screenWrap');
const canvas = document.getElementById('screenCanvas');
const cctx = canvas.getContext('2d', {alpha: false});
const screenMsg = document.getElementById('screenMsg');
let grid = null, screenWs = null, dragging = false, lastMove = 0, retry = null;

// Declared up here because screenConnect() tunes the stream for the viewer.
const isTouch = matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;

function screenConnect() {
    if (screenWs && (screenWs.readyState === 0 || screenWs.readyState === 1)) return;
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    // Match the pipe to the viewer. A phone was being sent a 2560px-wide frame at
    // quality 80 through a VPS in Germany; it only has ~400 CSS px of screen and
    // every wasted byte is a wasted round trip. On the LAN there is no reason to
    // hold back. `lan` is true when the page itself was opened over the local
    // address, which is the fast path worth bookmarking at home.
    const lan = /^(10\.|192\.168\.|127\.|localhost|172\.(1[6-9]|2\d|3[01])\.)/.test(location.hostname);
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const want = Math.round(Math.min(2560, Math.max(720, screenWrap.clientWidth * dpr)));
    const p = lan ? {w: Math.max(want, 1920), fps: 15, q: 80}
                  : {w: want, fps: isTouch ? 12 : 10, q: isTouch ? 58 : 72};
    screenWs = new WebSocket(`${proto}//${location.host}/api/screen?w=${p.w}&fps=${p.fps}&q=${p.q}`);
    screenWs.binaryType = 'arraybuffer';
    screenWs.onmessage = async (e) => {
        if (typeof e.data === 'string') {
            const d = JSON.parse(e.data);
            if (d.type === 'info') {
                grid = d.grid;
                canvas.width = grid.w; canvas.height = grid.h;
                cctx.fillStyle = '#000'; cctx.fillRect(0, 0, grid.w, grid.h);
            }
            return;
        }
        if (!grid) return;
        const index = new DataView(e.data).getUint16(0);
        const bmp = await createImageBitmap(new Blob([e.data.slice(2)], {type: 'image/jpeg'}));
        cctx.drawImage(bmp, (index % grid.cols) * grid.tile,
                            Math.floor(index / grid.cols) * grid.tile);
        bmp.close();
        if (screenMsg.style.display !== 'none') screenMsg.style.display = 'none';
    };
    screenWs.onclose = () => {
        screenWs = null;
        if (!document.hidden && document.getElementById('tab-screen').classList.contains('active')) {
            screenMsg.textContent = 'Reconnecting…'; screenMsg.style.display = 'block';
            retry = setTimeout(screenConnect, 1500);
        }
    };
}
function screenDisconnect() {
    if (retry) { clearTimeout(retry); retry = null; }
    if (screenWs) { const w = screenWs; screenWs = null; w.onclose = null; w.close(); }
}
function send(ev) { if (screenWs && screenWs.readyState === 1) screenWs.send(JSON.stringify(ev)); }

// where on the Mac's screen did this browser event land? (object-fit letterboxing)
function frac(e) {
    const r = canvas.getBoundingClientRect();
    const iw = canvas.width, ih = canvas.height;
    if (!iw || !ih) return null;
    const scale = Math.min(r.width / iw, r.height / ih);
    const offX = (r.width - iw * scale) / 2, offY = (r.height - ih * scale) / 2;
    const fx = (e.clientX - r.left - offX) / (iw * scale);
    const fy = (e.clientY - r.top - offY) / (ih * scale);
    if (fx < 0 || fy < 0 || fx > 1 || fy > 1) return null;
    return {fx, fy};
}
function mods(e) {
    const m = [];
    if (e.metaKey) m.push('cmd');
    if (e.shiftKey) m.push('shift');
    if (e.altKey) m.push('alt');
    if (e.ctrlKey) m.push('ctrl');
    return m;
}

canvas.addEventListener('mousedown', (e) => {
    const f = frac(e); if (!f) return;
    e.preventDefault(); screenWrap.focus(); dragging = true;
    send({t: 'down', ...f, btn: e.button === 2 ? 'right' : 'left', mods: mods(e)});
});
window.addEventListener('mousemove', (e) => {
    const now = Date.now(); if (now - lastMove < 25) return;
    lastMove = now;
    const f = frac(e); if (!f) return;
    if (dragging) send({t: 'drag', ...f});
    else if (screenWs && document.getElementById('tab-screen').classList.contains('active')) send({t: 'move', ...f});
});
window.addEventListener('mouseup', (e) => {
    if (!dragging) return;
    dragging = false;
    const f = frac(e) || {fx: 0.5, fy: 0.5};
    send({t: 'up', ...f, btn: e.button === 2 ? 'right' : 'left'});
});
canvas.addEventListener('dblclick', (e) => { const f = frac(e); if (f) send({t: 'dblclick', ...f}); });
canvas.addEventListener('contextmenu', (e) => e.preventDefault());
canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    send({t: 'scroll', dx: Math.round(-e.deltaX), dy: Math.round(-e.deltaY)});
}, {passive: false});

// ===== TOUCH =====
// Phones do not fire real mouse events. Safari fakes a click ~300ms after a tap
// and fakes nothing at all for a drag, which is why the screen felt dead and
// sluggish on a phone. These are the real thing: tap clicks instantly, one
// finger drags, two fingers scroll, a long press right-clicks.
if (isTouch) document.body.classList.add('touch');

let touchStart = null, longPress = null, panning = false, lastPan = null, moved = false;

function tfrac(t) { return frac({clientX: t.clientX, clientY: t.clientY}); }

canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    if (e.touches.length === 2) {                       // two fingers = scroll
        panning = true; moved = true;
        clearTimeout(longPress);
        lastPan = {x: (e.touches[0].clientX + e.touches[1].clientX) / 2,
                   y: (e.touches[0].clientY + e.touches[1].clientY) / 2};
        return;
    }
    const f = tfrac(e.touches[0]); if (!f) return;
    touchStart = f; moved = false; panning = false;
    send({t: 'move', ...f});                            // put the pointer there first
    longPress = setTimeout(() => {                      // held = right click
        longPress = null; moved = true;
        send({t: 'down', ...f, btn: 'right'});
        send({t: 'up', ...f, btn: 'right'});
        if (navigator.vibrate) navigator.vibrate(12);
    }, 500);
}, {passive: false});

canvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
    if (panning && e.touches.length === 2) {
        const x = (e.touches[0].clientX + e.touches[1].clientX) / 2;
        const y = (e.touches[0].clientY + e.touches[1].clientY) / 2;
        send({t: 'scroll', dx: Math.round(x - lastPan.x), dy: Math.round(y - lastPan.y)});
        lastPan = {x, y};
        return;
    }
    const f = tfrac(e.touches[0]); if (!f || !touchStart) return;
    const far = Math.hypot(f.fx - touchStart.fx, f.fy - touchStart.fy) > 0.012;
    if (!moved && far) {                                // became a drag
        clearTimeout(longPress); longPress = null; moved = true;
        dragging = true;
        send({t: 'down', ...touchStart, btn: 'left'});
    }
    if (dragging) send({t: 'drag', ...f});
    else if (!moved) send({t: 'move', ...f});
}, {passive: false});

canvas.addEventListener('touchend', (e) => {
    e.preventDefault();
    clearTimeout(longPress); longPress = null;
    if (panning) { panning = false; return; }
    const f = (e.changedTouches[0] && tfrac(e.changedTouches[0])) || touchStart;
    if (dragging) { dragging = false; send({t: 'up', ...(f || touchStart), btn: 'left'}); }
    else if (!moved && touchStart) {                    // a clean tap = a click
        send({t: 'down', ...touchStart, btn: 'left', mods: pendingMods()});
        send({t: 'up', ...touchStart, btn: 'left'});
        focusKeys();                                    // and raise the keyboard
    }
    touchStart = null;
}, {passive: false});

canvas.addEventListener('touchcancel', () => {
    clearTimeout(longPress); longPress = null; panning = false; dragging = false; touchStart = null;
}, {passive: false});

// ===== KEYBOARD =====
// typing goes wherever you clicked, like sitting at the machine
const SPECIAL = ['Enter','Tab','Backspace','Delete','Escape','ArrowLeft','ArrowRight',
                 'ArrowUp','ArrowDown','Home','End','PageUp','PageDown',
                 'F1','F2','F3','F4','F5','F6','F7','F8','F9','F10','F11','F12'];
const keyInput = document.getElementById('keyInput');
let stickyCmd = false;

function pendingMods() { return stickyCmd ? ['cmd'] : []; }
function clearSticky() {
    if (!stickyCmd) return;
    stickyCmd = false;
    document.querySelectorAll('.touch-bar [data-mod]').forEach(b => b.classList.remove('on'));
}
function focusKeys() {
    // Must run inside the user gesture or iOS ignores it.
    try { keyInput.focus({preventScroll: true}); } catch { keyInput.focus(); }
    resetKeyInput();
}

// ONE source of truth per keystroke. The first version listened for both
// keydown and input on the hidden field, and a soft keyboard fires BOTH for an
// ordinary character — preventDefault on keydown does not stop a phone
// inserting it — so every digit arrived twice.
//
// So: printable characters come ONLY from the input event, and Backspace comes
// only from the field getting shorter. The field is kept padded with
// non-breaking spaces so there is always something for Backspace to eat, which
// is what makes deletion detectable at all on iOS.
const PAD = '\u00a0'.repeat(8);

function resetKeyInput() {
    keyInput.value = PAD;
    try { keyInput.setSelectionRange(PAD.length, PAD.length); } catch {}
}
resetKeyInput();

keyInput.addEventListener('input', () => {
    const v = keyInput.value;
    if (v.length > PAD.length) {
        const typed = v.slice(PAD.length);
        if (stickyCmd && typed.length === 1) { send({t: 'combo', k: typed, mods: ['cmd']}); clearSticky(); }
        else send({t: 'text', s: typed});
    } else if (v.length < PAD.length) {
        for (let i = v.length; i < PAD.length; i++) send({t: 'key', k: 'Backspace', down: true, mods: []});
    }
    resetKeyInput();
});

// keydown on the field handles ONLY what the input event cannot express:
// modifier combos and the non-printing keys. Never printable characters, and
// never Backspace — those are the input event's job, and handling them here too
// is exactly what caused the double typing.
keyInput.addEventListener('keydown', (e) => {
    if (e.metaKey && e.key.length === 1) {
        e.preventDefault(); send({t: 'combo', k: e.key, mods: mods(e)}); clearSticky(); return;
    }
    if (e.key === 'Backspace') return;                       // handled by input
    if (SPECIAL.includes(e.key)) {
        e.preventDefault();
        send({t: 'key', k: e.key, down: true, mods: mods(e).concat(pendingMods())});
        clearSticky();
    }
});

// A real keyboard with nothing focused still works the old way.
function onKeydown(e) {
    if (document.activeElement === keyInput) return;         // the field owns it
    if ((e.metaKey || stickyCmd) && e.key.length === 1) {
        e.preventDefault(); send({t: 'combo', k: e.key, mods: e.metaKey ? mods(e) : ['cmd']}); clearSticky();
    } else if (SPECIAL.includes(e.key)) {
        e.preventDefault(); send({t: 'key', k: e.key, down: true, mods: mods(e).concat(pendingMods())}); clearSticky();
    } else if (e.key.length === 1) {
        e.preventDefault(); send({t: 'text', s: e.key}); clearSticky();
    }
}
screenWrap.addEventListener('keydown', onKeydown);

canvas.addEventListener('mousedown', focusKeys);

// The on-screen bar: keyboard toggle, a sticky ⌘ for shortcuts, and the keys a
// phone keyboard does not have.
document.getElementById('touchBar').addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    e.preventDefault();
    if (b.id === 'kbBtn') {
        if (document.activeElement === keyInput) keyInput.blur(); else focusKeys();
    } else if (b.dataset.mod) {
        stickyCmd = !stickyCmd; b.classList.toggle('on', stickyCmd); focusKeys();
    } else if (b.dataset.key) {
        send({t: 'key', k: b.dataset.key, down: true, mods: pendingMods()}); clearSticky();
    }
});

// nothing streams while this browser tab is in the background
document.addEventListener('visibilitychange', () => {
    if (document.hidden) screenDisconnect();
    else if (document.getElementById('tab-screen').classList.contains('active')) screenConnect();
});

// ===== TERMINAL (xterm.js + PTY backend) =====
const termStatus = document.getElementById('termStatus');
const termStatusText = document.getElementById('termStatusText');
const xtermContainer = document.getElementById('xterm-container');
let termRetry = 1000;
let term = null;
let fitAddon = null;

function setTermStatus(state, text) {
    termStatus.classList.toggle('connected', state === 'connected');
    termStatusText.textContent = text;
}

function initXterm() {
    if (term) return;
    term = new Terminal({
        cursorBlink: true,
        fontFamily: '"SF Mono", Menlo, Consolas, monospace',
        fontSize: 13,
        theme: {
            background: '#000000',
            foreground: '#e0e0e0',
            cursor: '#6366f1',
            selectionBackground: '#264f78',
            black: '#000000', red: '#ef4444', green: '#22c55e', yellow: '#eab308',
            blue: '#3b82f6', magenta: '#a855f7', cyan: '#06b6d4', white: '#e0e0e0',
            brightBlack: '#666666', brightRed: '#fca5a5', brightGreen: '#86efac',
            brightYellow: '#fde047', brightBlue: '#93c5fd', brightMagenta: '#d8b4fe',
            brightCyan: '#67e8f9', brightWhite: '#ffffff',
        },
        scrollback: 5000,
        convertEol: true,
    });
    fitAddon = new FitAddon.FitAddon();
    term.loadAddon(fitAddon);
    term.open(xtermContainer);
    setTimeout(() => fitAddon.fit(), 50);
    // Forward keystrokes -> WS
    term.onData(d => {
        if (termWs && termWs.readyState === 1) {
            termWs.send(JSON.stringify({ type: 'input', data: d }));
        }
    });
    term.onResize(({ cols, rows }) => {
        if (termWs && termWs.readyState === 1) {
            termWs.send(JSON.stringify({ type: 'resize', cols, rows }));
        }
    });
    // Refit on window resize and when terminal tab activates
    window.addEventListener('resize', () => { try { fitAddon.fit(); } catch {} });
}

function connectTerminal() {
    if (!authOk) return;
    initXterm();
    setTermStatus('connecting', 'Connecting...');
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    termWs = new WebSocket(`${proto}//${location.host}/api/terminal?token=${getToken()}`);
    termWs.binaryType = 'arraybuffer';
    window.termWs = termWs;
    termWs.onopen = () => {
        termRetry = 1000;
        setTermStatus('connected', 'Connected');
        // send initial size
        try { termWs.send(JSON.stringify({ type: 'resize', cols: term.cols, rows: term.rows })); } catch {}
    };
    termWs.onmessage = e => {
        if (e.data instanceof ArrayBuffer) {
            term.write(new Uint8Array(e.data));
        } else {
            term.write(e.data);
        }
    };
    termWs.onclose = (ev) => {
        if (ev.code === 1008 || ev.code === 4001) { authOk = false; window.location.href = '/login'; return; }
        setTermStatus('disconnected', `Disconnected (${ev.code}) — reconnecting...`);
        termRetry = Math.min(termRetry * 2, 30000);
        setTimeout(connectTerminal, termRetry);
    };
    termWs.onerror = () => setTermStatus('error', 'Error');
}

// Quick-shortcut buttons send the command + Enter into the PTY
function sendTermInput(text) {
    if (!termWs || termWs.readyState !== 1) return;
    if (text === 'clear') { term.clear(); return; }
    termWs.send(JSON.stringify({ type: 'input', data: text + '\n' }));
    term.focus();
}
document.querySelectorAll('.term-quick button').forEach(b => {
    b.addEventListener('click', () => sendTermInput(b.dataset.cmd));
});

// ===== STATUS CHIPS (CPU/RAM only) =====
async function updateStatus() {
    try {
        const d = await (await fetch('/api/status')).json();
        document.getElementById('cpuChip').textContent = 'CPU '+d.cpu_percent+'%';
        // Free, not "used" -- macOS keeps memory busy on purpose, so a
        // used-percentage sits near 50% forever and warns about nothing.
        const ram = document.getElementById('ramChip');
        ram.textContent = 'RAM ' + d.ram_free_percent + '% free';
        ram.style.color = d.mem_state === 'critical' ? '#e0655b'
                        : d.mem_state === 'tight' ? '#dda24a' : '';
        ram.title = d.ram_available_gb + ' GB available of ' + d.ram_total_gb + ' GB';
    } catch {}
}

// ===== INIT =====
screenConnect();
connectTerminal();
updateStatus();
setInterval(updateStatus, 10000);
</script>
<script>
/* --- machine tabs ------------------------------------------------------
   MINI / M5 / PC at the top of the UI. Picking one writes the fia_target
   cookie and reloads; nginx sends every request to that machine after that,
   so the page feels identical whichever Mac is behind it. */
(function(){
  const MACHINES = [
    {key:'mini', label:'Mini'},
    {key:'m5',   label:'M5'},
    {key:'pc',   label:'PC'},
  ];
  const m = document.cookie.match(/(?:^|;\s*)fia_target=([^;]+)/);
  const here = m ? decodeURIComponent(m[1]) : 'mini';
  const box = document.getElementById('machines');
  if (!box) return;

  for (const mc of MACHINES) {
    const b = document.createElement('button');
    b.className = 'mbtn' + (mc.key === here ? ' here' : '');
    b.type = 'button';
    b.title = mc.key === here ? 'driving this machine' : 'switch to ' + mc.label;
    b.innerHTML = '<span class="md" id="md-'+mc.key+'"></span>' + mc.label;
    b.onclick = () => {
      if (mc.key === here) return;
      document.cookie = 'fia_target=' + mc.key + '; path=/; max-age=31536000; samesite=lax';
      location.href = '/';
    };
    box.appendChild(b);

    fetch('/machines/probe/' + mc.key, {cache:'no-store'})
      .then(r => mark(mc.key, r.status >= 200 && r.status < 400))
      .catch(() => mark(mc.key, false));
  }

  function mark(key, up){
    const d = document.getElementById('md-'+key);
    if (!d) return;
    d.className = 'md ' + (up ? 'up' : 'down');
    if (!up) d.closest('.mbtn').dataset.live = 'down';
  }
})();

/* --- full screen -------------------------------------------------------
   Browser fullscreen plus a class that drops the top bars, so the remote
   desktop really does fill the display instead of sitting in a letterbox. */
(function(){
  const btn = document.getElementById('fsBtn');
  if (!btn) return;

  function on(){ return !!document.fullscreenElement; }

  function toggle(){
    if (on()) document.exitFullscreen();
    else document.documentElement.requestFullscreen().catch(()=>{
      document.body.classList.toggle('fullscreen');
    });
  }

  btn.onclick = toggle;
  document.addEventListener('fullscreenchange', () => {
    document.body.classList.toggle('fullscreen', on());
    btn.innerHTML = on() ? '&#x2922;' : '&#x2921;';
    window.dispatchEvent(new Event('resize'));
  });

})();
</script>
