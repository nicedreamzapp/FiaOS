<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ohm's voice</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --line:#262d36;
    --ink:#e6edf3; --dim:#8b949e; --accent:#58a6ff; --good:#3fb950;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:16px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text",Helvetica,Arial,sans-serif;
       padding:20px 16px 60px;}
  h1{font-size:20px;margin:0 0 4px;font-weight:600}
  p.sub{color:var(--dim);margin:0 0 20px;font-size:14px}
  .now{background:var(--panel);border:1px solid var(--line);border-radius:10px;
       padding:12px 14px;margin-bottom:22px;font-size:14px}
  .now b{color:var(--good);font-weight:600}
  h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);
     margin:26px 0 10px;font-weight:600}
  .row{display:flex;align-items:center;gap:10px;background:var(--panel);
       border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px}
  .row.sel{border-color:var(--accent)}
  .name{flex:1;min-width:0}
  .name .n{font-weight:600;font-size:15px}
  .name .d{color:var(--dim);font-size:12.5px}
  button{font:inherit;border:0;border-radius:8px;padding:9px 14px;cursor:pointer;
         -webkit-tap-highlight-color:transparent}
  .play{background:#21262d;color:var(--ink);border:1px solid var(--line);min-width:64px}
  .play.on{background:var(--accent);color:#0d1117;border-color:var(--accent)}
  .pick{background:transparent;color:var(--accent);border:1px solid var(--accent);min-width:76px}
  .pick.done{background:var(--good);border-color:var(--good);color:#0d1117}
  #toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);
         background:var(--good);color:#0d1117;padding:11px 18px;border-radius:9px;
         font-weight:600;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none;
         max-width:90vw;text-align:center}
  #toast.show{opacity:1}
  #toast.err{background:#f85149;color:#fff}
</style>
</head>
<body>

<h1>pick ohm's voice</h1>
<p class="sub">tap play to hear it, tap use to switch. takes effect on your next reply in the ohm chat.</p>

<div class="now">currently: <b id="cur">loading…</b></div>

<div id="list"></div>

<div id="toast"></div>

<script>
const MODELS = "$HOME/Models/piper/";
const JANE   = "$HOME/JaneOS/voices/";
const LIBRI  = "$HOME/piper_voices/en_US-libritts_r-medium.onnx";

const GROUPS = [
  { title: "named voices", items: [
    { n:"amy",     d:"warm, everyday american",       f:"en_US-amy-medium",        m:JANE+"en_US-amy-medium.onnx" },
    { n:"kristin", d:"the one that narrates you now", f:"en_US-kristin-medium",    m:JANE+"en_US-kristin-medium.onnx" },
    { n:"jenny",   d:"british, soft",                 f:"en_GB-jenny_dioco-medium",m:JANE+"en_GB-jenny_dioco-medium.onnx" },
    { n:"lessac",  d:"clear and neutral",             f:"en_US-lessac-medium",     m:MODELS+"en_US-lessac-medium.onnx" },
    { n:"hfc",     d:"crisp, news-read",              f:"en_US-hfc_female-medium", m:MODELS+"en_US-hfc_female-medium.onnx" },
    { n:"lj",      d:"highest quality model here",    f:"en_US-ljspeech-high",     m:MODELS+"en_US-ljspeech-high.onnx" },
    { n:"kathleen",d:"low-res, breathier",            f:"en_US-kathleen-low",      m:JANE+"en_US-kathleen-low.onnx" },
    { n:"ryan",    d:"male, high quality",            f:"en_US-ryan-high",         m:MODELS+"en_US-ryan-high.onnx" },
    { n:"joe",     d:"male, laid back",               f:"en_US-joe-medium",        m:MODELS+"en_US-joe-medium.onnx" },
    { n:"bryce",   d:"male, deeper",                  f:"en_US-bryce-medium",      m:MODELS+"en_US-bryce-medium.onnx" },
    { n:"hfc male",d:"male, crisp",                   f:"en_US-hfc_male-medium",   m:MODELS+"en_US-hfc_male-medium.onnx" },
    { n:"danny",   d:"male, low-res",                 f:"en_US-danny-low",         m:MODELS+"en_US-danny-low.onnx" },
    { n:"kusal",   d:"male, different accent",        f:"en_US-kusal-medium",      m:MODELS+"en_US-kusal-medium.onnx" },
    { n:"arctic",  d:"male, flat/robotic",            f:"en_US-arctic-medium",     m:MODELS+"en_US-arctic-medium.onnx" },
  ]},
  { title: "libritts speakers (904 to choose from, here's a spread)", items:
    [0,12,47,92,133,205,288,341,410,512,640,733,850].map(function(s){
      return { n:"libritts "+s, d: s===0 ? "ohm's voice right now" : "speaker "+s,
               f: s===0 ? "en_US-libritts_r-medium" : "libritts-s"+s, m:LIBRI, s:s };
    })
  }
];

var audio = null, playingBtn = null;

function toast(msg, isErr){
  var t = document.getElementById("toast");
  t.textContent = msg;
  t.className = "show" + (isErr ? " err" : "");
  setTimeout(function(){ t.className = ""; }, 3200);
}

function stop(){
  if (audio) { audio.pause(); audio = null; }
  if (playingBtn) { playingBtn.classList.remove("on"); playingBtn.textContent = "play"; playingBtn = null; }
}

function play(btn, file){
  var wasSame = (playingBtn === btn);
  stop();
  if (wasSame) return;
  audio = new Audio("/static/voices/" + file + ".wav");
  playingBtn = btn;
  btn.classList.add("on"); btn.textContent = "stop";
  audio.onended = stop;
  audio.onerror = function(){ stop(); toast("no sample file for that one", true); };
  audio.play().catch(function(){ stop(); toast("browser blocked playback, tap again", true); });
}

function shq(s){ return "'" + String(s).replace(/'/g, "'\\''") + "'"; }

function pick(btn, v){
  btn.disabled = true;
  var body = "model=" + v.m + "\nspeaker=" + (v.s || 0) + "\nlength_scale=1.0\nname=" + v.n + "\n";
  var cmd = "mkdir -p ~/.config/ohm && printf %s " + shq(body) + " > ~/.config/ohm/voice.conf && cat ~/.config/ohm/voice.conf";
  fetch("/api/command", {
    method:"POST", headers:{"Content-Type":"application/json"},
    credentials:"same-origin",
    body: JSON.stringify({ command: "RAW: " + cmd })
  }).then(function(r){
    if (r.status === 401) throw new Error("auth");
    return r.json();
  }).then(function(){
    document.querySelectorAll(".pick").forEach(function(b){ b.classList.remove("done"); b.textContent="use"; });
    document.querySelectorAll(".row").forEach(function(r){ r.classList.remove("sel"); });
    btn.classList.add("done"); btn.textContent = "using";
    btn.closest(".row").classList.add("sel");
    document.getElementById("cur").textContent = v.n;
    toast("ohm now talks as " + v.n);
  }).catch(function(e){
    toast(e.message === "auth"
      ? "log into fiaos first, then tap use again"
      : "couldn't save — just tell ohm: use " + v.n, true);
  }).then(function(){ btn.disabled = false; });
}

function loadCurrent(){
  fetch("/api/command", {
    method:"POST", headers:{"Content-Type":"application/json"}, credentials:"same-origin",
    body: JSON.stringify({ command: "RAW: cat ~/.config/ohm/voice.conf 2>/dev/null | grep '^name=' | cut -d= -f2-" })
  }).then(function(r){ return r.json(); }).then(function(d){
    var t = (d.output || d.result || d.stdout || "").trim();
    document.getElementById("cur").textContent = t || "libritts 0 (default)";
    document.querySelectorAll(".row").forEach(function(row){
      if (row.dataset.name === t) {
        row.classList.add("sel");
        var b = row.querySelector(".pick"); b.classList.add("done"); b.textContent = "using";
      }
    });
  }).catch(function(){
    document.getElementById("cur").textContent = "unknown (not logged into fiaos)";
  });
}

var list = document.getElementById("list");
GROUPS.forEach(function(g){
  var h = document.createElement("h2"); h.textContent = g.title; list.appendChild(h);
  g.items.forEach(function(v){
    var row = document.createElement("div");
    row.className = "row"; row.dataset.name = v.n;
    row.innerHTML = '<div class="name"><div class="n"></div><div class="d"></div></div>'
                  + '<button class="play">play</button><button class="pick">use</button>';
    row.querySelector(".n").textContent = v.n;
    row.querySelector(".d").textContent = v.d;
    row.querySelector(".play").onclick = function(){ play(this, v.f); };
    row.querySelector(".pick").onclick = function(){ pick(this, v); };
    list.appendChild(row);
  });
});
loadCurrent();
</script>
</body>
</html>
