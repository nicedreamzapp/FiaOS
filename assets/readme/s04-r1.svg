<svg xmlns="http://www.w3.org/2000/svg" width="820" height="133" viewBox="0 0 820 133" role="img" aria-label="One auth-gated page. tailscale, an SSH client and a VNC viewer each do a piece; FiaOS bundles them. Claude Code on iPhone. Your desktop does the heavy lifting; your phone is the front-end. Replace SSH + VNC + RDP. One web page instead of three apps."><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f7a4a"/><stop offset="1" stop-color="#3f6f5a"/></linearGradient><linearGradient id="n" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b3242"/><stop offset="1" stop-color="#262c3b"/></linearGradient></defs><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" text-rendering="geometricPrecision"><g transform="translate(0.0,0)"><clipPath id="c0_0"><rect width="263.5" height="133" rx="10"/></clipPath><rect width="263.5" height="133" rx="10" fill="url(#n)"/><rect width="263.5" height="4" fill="#4f7a4a" clip-path="url(#c0_0)"/><rect x=".5" y=".5" width="262.5" height="132" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="134" text-anchor="middle" y="38" font-size="19" font-weight="700" fill="#cdd9cc">🧠 One auth-gated page</text><text x="134" text-anchor="middle" y="68" font-size="17" font-weight="500" fill="#f2f5fa">tailscale, an SSH client and</text><text x="134" text-anchor="middle" y="93" font-size="17" font-weight="500" fill="#f2f5fa">a VNC viewer each do a</text><text x="134" text-anchor="middle" y="117" font-size="17" font-weight="500" fill="#f2f5fa">piece; FiaOS bundles them.</text></g><g transform="translate(275.5,0)"><clipPath id="c0_1"><rect width="294.0" height="133" rx="10"/></clipPath><rect width="294.0" height="133" rx="10" fill="url(#n)"/><rect width="294.0" height="4" fill="#4f7a4a" clip-path="url(#c0_1)"/><rect x=".5" y=".5" width="293.0" height="132" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="149" text-anchor="middle" y="38" font-size="19" font-weight="700" fill="#cdd9cc">🤖 Claude Code on iPhone</text><text x="149" text-anchor="middle" y="68" font-size="17" font-weight="500" fill="#f2f5fa">Your desktop does the heavy</text><text x="149" text-anchor="middle" y="93" font-size="17" font-weight="500" fill="#f2f5fa">lifting; your phone is the</text><text x="149" text-anchor="middle" y="117" font-size="17" font-weight="500" fill="#f2f5fa">front-end.</text></g><g transform="translate(581.4,0)"><clipPath id="c0_2"><rect width="238.6" height="133" rx="10"/></clipPath><rect width="238.6" height="133" rx="10" fill="url(#n)"/><rect width="238.6" height="4" fill="#4f7a4a" clip-path="url(#c0_2)"/><rect x=".5" y=".5" width="237.6" height="132" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="121" text-anchor="middle" y="38" font-size="19" font-weight="700" fill="#cdd9cc">📡 Replace SSH +</text><text x="121" text-anchor="middle" y="63" font-size="19" font-weight="700" fill="#cdd9cc">VNC + RDP</text><text x="121" text-anchor="middle" y="93" font-size="17" font-weight="500" fill="#f2f5fa">One web page instead of</text><text x="121" text-anchor="middle" y="117" font-size="17" font-weight="500" fill="#f2f5fa">three apps.</text></g></g></svg>
