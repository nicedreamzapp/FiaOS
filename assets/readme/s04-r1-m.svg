<svg xmlns="http://www.w3.org/2000/svg" width="358" height="304" viewBox="0 0 358 304" role="img" aria-label="One auth-gated page. tailscale, an SSH client and a VNC viewer each do a piece; FiaOS bundles them. Claude Code on iPhone. Your desktop does the heavy lifting; your phone is the front-end. Replace SSH + VNC + RDP. One web page instead of three apps."><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f7a4a"/><stop offset="1" stop-color="#3f6f5a"/></linearGradient><linearGradient id="n" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b3242"/><stop offset="1" stop-color="#262c3b"/></linearGradient></defs><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" text-rendering="geometricPrecision"><g transform="translate(0.0,0)"><clipPath id="c0_0"><rect width="358.0" height="102" rx="10"/></clipPath><rect width="358.0" height="102" rx="10" fill="url(#n)"/><rect width="358.0" height="4" fill="#4f7a4a" clip-path="url(#c0_0)"/><rect x=".5" y=".5" width="357.0" height="101" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="181" text-anchor="middle" y="36" font-size="18" font-weight="700" fill="#cdd9cc">🧠 One auth-gated page</text><text x="181" text-anchor="middle" y="65" font-size="16" font-weight="500" fill="#f2f5fa">tailscale, an SSH client and a VNC viewer</text><text x="181" text-anchor="middle" y="87" font-size="16" font-weight="500" fill="#f2f5fa">each do a piece; FiaOS bundles them.</text></g><g transform="translate(0.0,112)"><clipPath id="c1_0"><rect width="358.0" height="102" rx="10"/></clipPath><rect width="358.0" height="102" rx="10" fill="url(#n)"/><rect width="358.0" height="4" fill="#4f7a4a" clip-path="url(#c1_0)"/><rect x=".5" y=".5" width="357.0" height="101" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="181" text-anchor="middle" y="36" font-size="18" font-weight="700" fill="#cdd9cc">🤖 Claude Code on iPhone</text><text x="181" text-anchor="middle" y="65" font-size="16" font-weight="500" fill="#f2f5fa">Your desktop does the heavy lifting; your</text><text x="181" text-anchor="middle" y="87" font-size="16" font-weight="500" fill="#f2f5fa">phone is the front-end.</text></g><g transform="translate(0.0,224)"><clipPath id="c2_0"><rect width="358.0" height="80" rx="10"/></clipPath><rect width="358.0" height="80" rx="10" fill="url(#n)"/><rect width="358.0" height="4" fill="#4f7a4a" clip-path="url(#c2_0)"/><rect x=".5" y=".5" width="357.0" height="79" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="181" text-anchor="middle" y="36" font-size="18" font-weight="700" fill="#cdd9cc">📡 Replace SSH + VNC + RDP</text><text x="181" text-anchor="middle" y="65" font-size="16" font-weight="500" fill="#f2f5fa">One web page instead of three apps.</text></g></g></svg>
