<svg xmlns="http://www.w3.org/2000/svg" width="358" height="282" viewBox="0 0 358 282" role="img" aria-label="No default password. No fallback in the source. Rate-limited login. 10 attempts per 5 minutes per IP. Treat it like an SSH key. Anyone with the password has the same power as SSH."><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9a5a4a"/><stop offset="1" stop-color="#8a4f5a"/></linearGradient><linearGradient id="n" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2b3242"/><stop offset="1" stop-color="#262c3b"/></linearGradient></defs><g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" text-rendering="geometricPrecision"><g transform="translate(0.0,0)"><clipPath id="c0_0"><rect width="358.0" height="80" rx="10"/></clipPath><rect width="358.0" height="80" rx="10" fill="url(#n)"/><rect width="358.0" height="4" fill="#9a5a4a" clip-path="url(#c0_0)"/><rect x=".5" y=".5" width="357.0" height="79" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="181" text-anchor="middle" y="36" font-size="18" font-weight="700" fill="#e2d0cc">🔒 No default password</text><text x="181" text-anchor="middle" y="65" font-size="16" font-weight="500" fill="#f2f5fa">No fallback in the source.</text></g><g transform="translate(0.0,90)"><clipPath id="c1_0"><rect width="358.0" height="80" rx="10"/></clipPath><rect width="358.0" height="80" rx="10" fill="url(#n)"/><rect width="358.0" height="4" fill="#9a5a4a" clip-path="url(#c1_0)"/><rect x=".5" y=".5" width="357.0" height="79" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="181" text-anchor="middle" y="36" font-size="18" font-weight="700" fill="#e2d0cc">⏱️ Rate-limited login</text><text x="181" text-anchor="middle" y="65" font-size="16" font-weight="500" fill="#f2f5fa">10 attempts per 5 minutes per IP.</text></g><g transform="translate(0.0,180)"><clipPath id="c2_0"><rect width="358.0" height="102" rx="10"/></clipPath><rect width="358.0" height="102" rx="10" fill="url(#n)"/><rect width="358.0" height="4" fill="#9a5a4a" clip-path="url(#c2_0)"/><rect x=".5" y=".5" width="357.0" height="101" rx="10" fill="none" stroke="rgba(255,255,255,.28)"/><text x="181" text-anchor="middle" y="36" font-size="18" font-weight="700" fill="#e2d0cc">⚠️ Treat it like an SSH key</text><text x="181" text-anchor="middle" y="65" font-size="16" font-weight="500" fill="#f2f5fa">Anyone with the password has the same</text><text x="181" text-anchor="middle" y="87" font-size="16" font-weight="500" fill="#f2f5fa">power as SSH.</text></g></g></svg>
